name: Seelen release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to verify and publish (MAJOR.MINOR.PATCH)
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Release tag must be vMAJOR.MINOR.PATCH.' }
          "RELEASE_VERSION=$($env:GITHUB_REF_NAME.Substring(1))" | Out-File $env:GITHUB_ENV -Append

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/seelen-detection
          path: standard
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/seelen-ui-integration
          path: seelen
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make

      - name: Build standard BatteryHub
        working-directory: standard
        shell: msys2 {0}
        run: make VERSION="$RELEASE_VERSION" CHANNEL=dev

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package standard BatteryHub
        working-directory: standard
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version $env:RELEASE_VERSION -Flavor Standard

      - name: Build Seelen BatteryHub
        working-directory: seelen
        shell: msys2 {0}
        run: make SEELEN_INTEGRATION=1 VERSION="$RELEASE_VERSION" CHANNEL=seelen

      - name: Package Seelen BatteryHub
        working-directory: seelen
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version $env:RELEASE_VERSION -Flavor Seelen

      - name: Assemble release files and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "standard/dist/BatteryHub-Standard-Setup-$env:RELEASE_VERSION.exe" release/
          Copy-Item "seelen/dist/BatteryHub-Seelen-Setup-$env:RELEASE_VERSION.exe" release/
          Copy-Item "seelen/dist/BatteryHub-Seelen-$env:RELEASE_VERSION-portable.zip" release/
          Copy-Item seelen/third-party/seelen-ui/plugin/BatteryHub-Seelen.yml release/
          $sums = Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS.txt'), (($sums -join "`n") + "`n"), (New-Object Text.UTF8Encoding($false)))
          @"
          # BatteryHub Seelen Integration v$env:RELEASE_VERSION

          This is an ISOByte00 integration fork release, not an official BatteryHub release.

          - Adds a Seelen-specific independent update channel.
          - Enables manual and approximately daily automatic update checks.
          - Requires a locally signed manifest before any installer can run.
          - Preserves existing BatteryHub and Seelen integration settings during updates.
          - Preserves the original BatteryHub developer attribution, license and Ko-fi link.
          "@.Trim() | Set-Content release/RELEASE_NOTES.md -NoNewline

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seelen-release
          path: release/*

  draft:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: seelen-release
          path: release

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: BatteryHub Seelen Integration ${{ github.ref_name }}
          draft: true
          prerelease: true
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.exe
            release/*.zip
            release/BatteryHub-Seelen.yml
            release/SHA256SUMS.txt

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/seelen-ui-integration
          persist-credentials: false

      - name: Download draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Version must be MAJOR.MINOR.PATCH.' }
          New-Item -ItemType Directory -Force release | Out-Null
          gh release download "v$env:RELEASE_VERSION" --repo $env:GITHUB_REPOSITORY --dir release

      - name: Verify signature and every release asset
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/verify-seelen-release.ps1 -Version $env:RELEASE_VERSION -AssetDirectory release

      - name: Publish verified draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release edit "v$env:RELEASE_VERSION" --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
