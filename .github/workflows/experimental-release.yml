name: Seelen release

on:
  push:
    tags: ["v0.3.0"]

env:
  RELEASE_VERSION: 0.3.0

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/seelen-detection
          path: standard
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/seelen-ui-integration
          path: seelen
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make

      - name: Build standard BatteryHub
        working-directory: standard
        shell: msys2 {0}
        run: make VERSION="$RELEASE_VERSION" CHANNEL=dev

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package standard BatteryHub
        working-directory: standard
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version $env:RELEASE_VERSION

      - name: Build Seelen BatteryHub
        working-directory: seelen
        shell: msys2 {0}
        run: make SEELEN_INTEGRATION=1 VERSION="$RELEASE_VERSION" CHANNEL=seelen

      - name: Package Seelen BatteryHub
        working-directory: seelen
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version $env:RELEASE_VERSION -Flavor Seelen

      - name: Assemble release files and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "standard/dist/BatteryHub-Setup-$env:RELEASE_VERSION.exe" "release/BatteryHub-Standard-Setup-$env:RELEASE_VERSION.exe"
          Copy-Item "seelen/dist/BatteryHub-Seelen-Setup-$env:RELEASE_VERSION.exe" release/
          Copy-Item "seelen/dist/BatteryHub-Seelen-$env:RELEASE_VERSION-portable.zip" release/
          Copy-Item seelen/third-party/seelen-ui/plugin/BatteryHub-Seelen.yml release/
          $sums = Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS.txt'), (($sums -join "`n") + "`n"), (New-Object Text.UTF8Encoding($false)))
          $standard = git -C standard rev-parse HEAD
          $seelen = git -C seelen rev-parse HEAD
          @"
          # BatteryHub Seelen Integration v0.3.0

          This is an ISOByte00 integration fork release, not an official BatteryHub release.

          - Synchronizes tray/widget mode, stacked layout, Seelen integration state and the new monochrome preference with Fancy Toolbar.
          - Adds explicit pending, no-device, disconnected, invalid-data and stale-synchronization states.
          - Uses a request heartbeat independent from hardware scan timing so cached responses do not look current forever.
          - Fixes native menu focus, dismissal and z-order with a short-lived topmost tool-window owner.
          - Ships one self-contained plugin file: BatteryHub-Seelen.yml.
          - Preserves the original BatteryHub developer attribution, licenses and Ko-fi link.

          - Standard installer source: feat/seelen-detection @ $standard
          - Seelen installer source: feat/seelen-ui-integration @ $seelen
          - The Seelen installer is verified by the standard build against the GitHub asset digest and SHA256SUMS.txt before it can be run.
          "@.Trim() | Set-Content release/RELEASE_NOTES.md -NoNewline

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seelen-release
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: seelen-release
          path: release

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.3.0
          target_commitish: ${{ github.sha }}
          name: BatteryHub Seelen Integration v0.3.0
          prerelease: true
          body_path: release/RELEASE_NOTES.md
          files: |
            release/BatteryHub-Standard-Setup-0.3.0.exe
            release/BatteryHub-Seelen-Setup-0.3.0.exe
            release/BatteryHub-Seelen-0.3.0-portable.zip
            release/BatteryHub-Seelen.yml
            release/SHA256SUMS.txt
