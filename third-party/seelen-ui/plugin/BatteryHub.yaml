id: '@isobyte/batteryhub'
metadata:
  displayName: BatteryHub
  description: BatteryHub Fancy Toolbar module.
  portrait: null
  banner: null
  screenshots: []
  tags:
  - toolbar
  appTargetVersion: null
  premium: false
  extras: {}
  remote: null
icon: LuBatteryMedium
target: '@seelen/fancy-toolbar'
plugin:
  id: ''
  scopes: []
  template: |2

    // BatteryHub / Seelen UI Fancy Toolbar template.
    // A failed Seelen remoteData fetch can retain the previous successful value.
    // This template can classify the latest value it receives, but cannot
    // independently detect a failed HTTP request after the last successful one.

    const showStatus = (symbol, label, detail, color = "currentColor") => Button({
      tooltip: detail,
      content: [icon(symbol), " ", label],
      style: {
        display: "flex",
        alignItems: "center",
        gap: "0.25rem",
        color,
        whiteSpace: "nowrap",
      },
    });

    let data;
    if (typeof batteryHub === "string") {
      if (!batteryHub.trim()) {
        return showStatus(
          "LuWifiOff",
          "BatteryHub erişilemiyor",
          "BatteryHub kapalı, Seelen entegrasyonu devre dışı veya yerel bağlantı kurulamadı."
        );
      }
      try {
        data = JSON.parse(batteryHub);
      } catch {
        return showStatus("LuAlertCircle", "Geçersiz yanıt", "BatteryHub tarafından gönderilen veri JSON biçiminde değil.", "#ef4444");
      }
    } else if (batteryHub && typeof batteryHub === "object" && !Array.isArray(batteryHub)) {
      data = batteryHub;
    } else {
      return showStatus(
        "LuWifiOff",
        "BatteryHub erişilemiyor",
        "BatteryHub kapalı, Seelen entegrasyonu devre dışı veya yerel bağlantı kurulamadı."
      );
    }

    if (!data || typeof data !== "object" || Array.isArray(data)) {
      return showStatus("LuAlertCircle", "Geçersiz yanıt", "BatteryHub beklenen veri yapısını göndermedi.", "#ef4444");
    }

    if (data.status === "pending") {
      return showStatus("LuRefreshCw", "Cihazlar taranıyor", "BatteryHub çalışıyor, ilk cihaz taraması sürüyor.");
    }
    if (data.status === "disabled") {
      return showStatus("LuWifiOff", "Entegrasyon kapalı", "BatteryHub ayarlarından Seelen UI entegrasyonunu etkinleştirin.");
    }
    if (data.status === "error" || data.status === "unavailable") {
      return showStatus("LuAlertCircle", "Veri alınamıyor", "BatteryHub bağlantısı kuruldu fakat cihaz verisi alınamadı.", "#ef4444");
    }
    if (data.status !== undefined && data.status !== "ready") {
      return showStatus("LuAlertCircle", "Bilinmeyen durum", "BatteryHub bilinmeyen bir durum kodu gönderdi.", "#eab308");
    }
    if (!Array.isArray(data.devices)) {
      return showStatus("LuAlertCircle", "Cihaz verisi hatalı", "BatteryHub yanıtında geçerli bir cihaz listesi bulunamadı.", "#ef4444");
    }
    if (data.devices.length === 0) {
      return showStatus("LuBatteryMedium", "Cihaz bulunamadı", "BatteryHub çalışıyor ancak görüntülenecek desteklenen cihaz yok.");
    }

    const icons = {
      mouse: "LuMouse",
      keyboard: "LuKeyboard",
      headset: "LuHeadphones",
      gamepad: "LuGamepad2",
      phone: "LuSmartphone",
      microphone: "LuMic",
    };

    const normalized = data.devices
      .filter((d) => d && typeof d === "object" && !Array.isArray(d))
      .map((d) => {
        const kind = typeof d.kind === "string" ? d.kind.toLowerCase().trim() : "other";
        const valid = typeof d.percent === "number" && Number.isFinite(d.percent) && d.percent >= 0 && d.percent <= 100;
        const percent = valid ? Math.round(d.percent) : -1;
        const connected = d.connected !== false;
        const asleep = d.asleep === true;
        const charging = d.charging === true && connected && !asleep && percent < 100;
        const name = typeof d.name === "string" && d.name.trim() ? d.name.trim() : "BatteryHub cihazı";
        const label = typeof d.label === "string" ? d.label.trim().slice(0, 8) : "";
        const rawTooltip = typeof d.tooltip === "string" ? d.tooltip.trim() : "";
        const description = !connected ? "Bağlı değil" : asleep ? "Uyku modunda, pil bilgisi güncel olmayabilir" : !valid ? "Pil yüzdesi bilinmiyor" : "";
        return {
          symbol: icons[kind] || "LuBatteryMedium",
          percent,
          valid,
          connected,
          asleep,
          charging,
          dim: d.dim === true || !connected || asleep || !valid,
          label,
          tooltip: [rawTooltip || name, description].filter(Boolean).join(" — "),
        };
      });

    if (!normalized.length) {
      return showStatus("LuAlertCircle", "Cihaz verisi hatalı", "BatteryHub geçerli bir cihaz kaydı göndermedi.", "#ef4444");
    }

    return Group({
      content: normalized.map((device) => {
        const active = device.connected && !device.asleep && device.valid;
        const color = !active ? "currentColor" : device.charging ? "#3b82f6" : device.percent < 20 ? "#ef4444" : device.percent <= 85 ? "#eab308" : "#22c55e";
        return Button({
          tooltip: device.tooltip,
          content: [
            icon(device.symbol),
            active ? device.percent + "%" : "—",
            device.label ? " " + device.label : "",
          ],
          onClick: 'open("batteryhub://show-menu")',
          style: {
            display: "flex",
            alignItems: "center",
            gap: "0.25rem",
            color,
            opacity: device.dim ? 0.55 : 1,
            whiteSpace: "nowrap",
            maxWidth: "140px",
          },
        });
      }),
      style: {
        display: "flex",
        alignItems: "center",
        gap: "0.5rem",
        padding: "0 var(--item-padding)",
      },
    });
  render: null
  canvasSize: null
  tooltip: null
  badge: null
  onClick: null
  onWheelUp: null
  onWheelDown: null
  style: {}
  remoteData:
    batteryHub:
      url: http://127.0.0.1:37842/seelen/state-text
      requestInit: null
      updateIntervalSeconds: 3
